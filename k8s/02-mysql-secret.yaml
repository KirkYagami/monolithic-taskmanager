# ============================================================
# CONCEPT: Secret
# Secrets store sensitive data (passwords, tokens) as base64.
# Pods reference them via env vars — never hardcode passwords!
#
# To encode your own values:
#   echo -n "taskpass" | base64   → dGFza3Bhc3M=
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: taskmanager
type: Opaque
data:
  # base64 encoded values (NOT encryption — just encoding)
  mysql-root-password: cm9vdHBhc3M=    # rootpass
  mysql-user: dGFza3VzZXI=             # taskuser
  mysql-password: dGFza3Bhc3M=         # taskpass
  mysql-database: dGFza21hbmFnZXI=     # taskmanager
