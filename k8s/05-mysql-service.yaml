# ============================================================
# CONCEPT: Service — ClusterIP
#
# Problem: MySQL Pod gets a new IP every time it restarts.
# Solution: Service gives a STABLE DNS name + virtual IP.
#
# ClusterIP = internal-only. No external access.
# The backend connects via: mysql-service:3306
# Kubernetes DNS resolves "mysql-service" → ClusterIP automatically.
#
# This replaces Docker Compose's service discovery where
# backend could reach db via hostname "db".
#
# Traffic flow:
#   Backend Pod → mysql-service:3306 (ClusterIP) → MySQL Pod:3306
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: taskmanager
  labels:
    app: mysql
spec:
  type: ClusterIP   # Default type — internal only
  selector:
    app: mysql      # Routes to Pods with label app=mysql
  ports:
    - name: mysql
      port: 3306        # Port the service exposes (what callers use)
      targetPort: 3306  # Port on the Pod (container port)
