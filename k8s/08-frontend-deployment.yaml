# ============================================================
# Angular Frontend — Deployment with 2 replicas
#
# The frontend is stateless (just serves static files via nginx)
# — perfect for horizontal scaling.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskmanager
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: taskmanager-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          # The Angular app needs to know the backend URL.
          # Option 1: Build-time env var (in Dockerfile/nginx.conf)
          # Option 2: Runtime env var passed here
          env:
            - name: BACKEND_URL
              value: "http://backend-service:8080"   # Internal ClusterIP DNS
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
