<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — Page Not Found</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #232f3e;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .container { max-width: 500px; }

    .code {
      font-size: 7rem;
      font-weight: 900;
      color: #ff9900;
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    p {
      font-size: 1rem;
      opacity: 0.6;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    a {
      display: inline-block;
      background: #ff9900;
      color: #232f3e;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }

    a:hover { opacity: 0.85; }

    .icon { font-size: 3rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">☁️</div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist in this S3 bucket.<br/>
      This custom error page is being served by S3's static website hosting feature.
    </p>
    <a href="/">← Back to Home</a>
  </div>
</body>
</html>
