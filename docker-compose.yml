services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATEBASE: taskmanager
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskuser", "-ptaskpass"]

      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./taskmanager
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/taskmanager
      SPRING_DATASOURCE_USERNAME: taskuser
      SPRING_DATASOURCE_PASSWORD: taskpass
    depends_on:
      db:
        condition: service_healthy
    

  frontend:
    build: ./ng-frontend
    ports:
      - "80:80"
    depends_on:
      - backend


volumes:
  mysql_data:
  




  

